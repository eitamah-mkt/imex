<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IMEX Fitness</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="lang-wrapper">
    <div class="language-selector">
      <button class="lang-btn" data-lang="pt">
        <img src="image/br.png" alt="Português" class="flag-icon">
      </button>
      <button class="lang-btn" data-lang="en">
        <img src="image/eua.png" alt="English" class="flag-icon">
      </button>
      <button class="lang-btn" data-lang="es">
        <img src="image/es.png" alt="Español" class="flag-icon">
      </button>
    </div>
  </div>

  <main>
    <div class="hero">
      <div class="logo-frame">
        <img src="image/perfil.png" alt="IMEX Fitness">
      </div>
      <h1>IMEX <span>Fitness</span></h1>
      <p class="tagline">Equipamentos e Acessórios Fitness</p>
    </div>

    <div class="buttons-group">
      <a href="https://www.instagram.com/imex_fitness/" class="btn" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon"><i class="fab fa-instagram"></i></span>
        <span>@imexfitness</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="https://api.whatsapp.com/send?1=pt_BR&phone=5585999409290" class="btn" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon"><i class="fab fa-whatsapp"></i></span>
        <span>Já sou cliente</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="https://api.whatsapp.com/send?1=pt_BR&phone=5585999409290" class="btn" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon"><i class="fab fa-whatsapp"></i></span>
        <span>Novos clientes Ceará</span>
        <span class="btn-arrow">→</span>
      </a>
      <a href="https://wa.me/message/GWXZ2QCCSXXLK1" class="btn" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon"><i class="fab fa-whatsapp"></i></span>
        <span>Novos clientes outros estados</span>
        <span class="btn-arrow">→</span>
      </a>
    </div>
  </main>

  <footer>
    <p>Powered by <a href="https://www.hangarcreativehub.com/" target="_blank" rel="noopener noreferrer">Hangar Creative Hub</a> <span class="dot">✱</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
